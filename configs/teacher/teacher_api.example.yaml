teacher_api:
  base_url_env: GEN_RETRY_TEACHER_BASE_URL
  api_key_env: GEN_RETRY_TEACHER_API_KEY
  model_env: GEN_RETRY_TEACHER_MODEL
  timeout_env: GEN_RETRY_TEACHER_TIMEOUT
  max_retries_env: GEN_RETRY_TEACHER_MAX_RETRIES
  defaults:
    base_url: https://your-proxy.example.com/v1
    api_key: your_api_key_here
    model: gpt-5.5
    timeout: 120
    max_retries: 3
  notes:
    - Placeholder only. Stage 1 and Stage 2 do not implement teacher calls.
    - Use an OpenAI-compatible relay by setting a custom base URL.
    - Never commit real API keys.
